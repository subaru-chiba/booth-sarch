[project]
name = "booth-sarch"
version = "0.1.0"
description = "Booth sales trend tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
